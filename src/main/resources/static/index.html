<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSP to Thymeleaf Converter</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
            background-color: #f5f5f5;
            color: #333;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 30px;
        }
        .container {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-direction: column;
        }
        .code-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }
        textarea {
            width: 100%;
            min-height: 400px;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-family: 'Consolas', monospace;
            font-size: 14px;
            resize: vertical;
            background-color: #fff;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #2980b9;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            background-color: #fff;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .options {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }
        .radio-group {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .spinner {
            display: none;
            margin-left: 10px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3498db;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 2s linear infinite;
        }
        .error {
            color: #e74c3c;
            margin-top: 10px;
        }
        .success {
            color: #2ecc71;
            margin-top: 10px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <h1>JSP to Thymeleaf Converter</h1>
    
    <div class="container">
        <div class="options">
            <div class="radio-group">
                <input type="radio" id="jsonOutput" name="outputType" value="json" checked>
                <label for="jsonOutput">JSON Output</label>
            </div>
            <div class="radio-group">
                <input type="radio" id="rawOutput" name="outputType" value="raw">
                <label for="rawOutput">Raw HTML Output</label>
            </div>
        </div>
        
        <div class="code-container">
            <div class="form-group">
                <label for="jspCode">JSP Code:</label>
                <textarea id="jspCode" placeholder="Paste your JSP code here..."><%@ page language="java" contentType="text/html; charset=UTF-8" pageEncoding="UTF-8"%>
<%@ taglib uri="http://java.sun.com/jsp/jstl/core" prefix="c" %>

    <jsp:include page="footer.jsp"/>
    
    <script>
        function updateProfile() {
            <% 
                String userId = (String) session.getAttribute("userId");
                if(userId != null) {
                    // Some complex Java code here
                }
            %>
            alert('Profile updated!');
        }
    </script>
</body>
</html></textarea>
            </div>
            <div class="form-group">
                <label for="thymeleafCode">Thymeleaf Code:</label>
                <textarea id="thymeleafCode" readonly placeholder="Converted Thymeleaf code will appear here..."></textarea>
            </div>
        </div>
        
        <div>
            <button id="convertButton">Convert to Thymeleaf</button>
            <span class="spinner" id="spinner"></span>
            <span class="error" id="error"></span>
            <span class="success" id="success"></span>
        </div>
    </div>

    <script>
        document.getElementById('convertButton').addEventListener('click', function() {
            const jspCode = document.getElementById('jspCode').value;
            const outputType = document.querySelector('input[name="outputType"]:checked').value;
            const thymeleafCodeElement = document.getElementById('thymeleafCode');
            const spinner = document.getElementById('spinner');
            const errorElement = document.getElementById('error');
            const successElement = document.getElementById('success');
            
            if (!jspCode.trim()) {
                errorElement.textContent = 'Please enter JSP code';
                successElement.textContent = '';
                return;
            }
            
            errorElement.textContent = '';
            successElement.textContent = '';
            thymeleafCodeElement.value = '';
            spinner.style.display = 'inline-block';
            
            const endpoint = outputType === 'raw' 
                ? '/api/conversion/jsp-to-thymeleaf/raw'
                : '/api/conversion/jsp-to-thymeleaf';
                
            fetch(endpoint, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ jspCode: jspCode })
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                
                if (outputType === 'raw') {
                    return response.text();
                } else {
                    return response.json();
                }
            })
            .then(data => {
                spinner.style.display = 'none';
                
                if (outputType === 'raw') {
                    thymeleafCodeElement.value = data;
                } else {
                    thymeleafCodeElement.value = data.thymeleafCode;
                }
                
                successElement.textContent = 'Conversion successful!';
            })
            .catch(error => {
                spinner.style.display = 'none';
                errorElement.textContent = 'Error: ' + error.message;
            });
        });
    </script>
</body>
</html>
