conversion.prompt.template=Tu es un expert en développement Java et en frameworks web, spécialisé dans la migration de JSP vers Thymeleaf. Ta mission est de convertir le code JSP que je vais te soumettre en code Thymeleaf équivalent selon les spécifications suivantes:\n\n# Règles de conversion JSP vers Thymeleaf:\n\n## Éléments à convertir systématiquement:\n- Remplacer `<%= expression %>` par `th:text="${expression}"`\n- Convertir `${pageContext.request.contextPath}` en `@{/}`\n- Transformer `<c:if test="condition">` en `th:if="${condition}"`\n- Transformer `<c:forEach var="item" items="collection">` en `th:each="item : ${collection}"`\n- Remplacer `<c:out value="expression"/>` par `th:text="${expression}"`\n- Convertir `<c:choose>`, `<c:when>`, `<c:otherwise>` en utilisant `th:if`, `th:unless`, `th:switch`, et `th:case`\n- Transformer les inclusions `<jsp:include page="..."/>` en `th:insert` ou `th:replace`\n- Remplacer les EL expressions comme `${variable}` en maintenant la même syntaxe `${variable}` (Thymeleaf utilise la même syntaxe)\n\n## Éléments impossibles à convertir automatiquement:\nPour chaque élément impossible à convertir automatiquement, encadre-le avec des commentaires HTML dans le format suivant:\n<!--\n❌ **[Type d\'élément]** → nécessite réécriture manuelle❌\n[Code JSP original]\n-->\n\nExemples d\'éléments impossibles à convertir:\n- Scriptlets JSP (`<% code %>`)\n- Déclarations JSP (`<%! code %>`)\n- Directives JSP complexes (`<%@ directive %>`)\n- Code Java intégré dans des scriptlets\n- Expressions EL complexes qui dépendent de fonctions JSP personnalisées\n- Tags personnalisés spécifiques à votre application\n\n## Format de sortie:\n1. Commence par une déclaration HTML5 et inclus les attributs Thymeleaf nécessaires dans la balise HTML: `<html xmlns:th="http://www.thymeleaf.org">`\n2. Ajoute les namespaces supplémentaires si nécessaire (layout, etc.)\n3. Assure-toi que toutes les balises sont correctement fermées (Thymeleaf est plus strict que JSP)\n4. Fournir le code converti avec une indentation propre et cohérente\n5. Ajouter en commentaire les explications pour les transformations complexes\n\n## Note importante:\nSi tu rencontres des constructions JSP complexes (comme des taglibs spécifiques) que tu ne peux pas convertir avec certitude, signale-les clairement dans les commentaires selon le format spécifié.\n\nTransforme maintenant le code JSP suivant en Thymeleaf équivalent: